services:
  - type: web
    name: printmydoc-whatsapp-worker
    runtime: node
    rootDir: apps/whatsapp-worker
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    disk:
      name: whatsapp-worker-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: WHATSAPP_AUTH_DIR
        value: /data/whatsapp-auth
      - key: DATABASE_URL
        sync: false
      - key: WORKER_SECRET
        sync: false
